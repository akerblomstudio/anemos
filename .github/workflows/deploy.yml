name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static site
        run: bun run build:static
        env:
          # Served from the root of the custom domain anemos.se (see public/CNAME).
          BASE_PATH: /
      - name: Verify static output before uploading
        run: |
          test "$(cat dist/client/CNAME)" = "anemos.se"
          test -s dist/client/404.html
          for page in index.html program/index.html skapa-med-oss/index.html om-anemos/index.html kontakt/index.html integritet/index.html; do
            test -s "dist/client/$page"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
